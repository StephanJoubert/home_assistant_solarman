# SOFAR 4KTLM-G3: single-phase, non-hybrid, two MPPT inputs.
# Hardware-tested with LSW3_15_270A_1.68 over Solarman V5, Modbus slave 1.
# Read complete, block-aligned ranges: interior-start requests can return
# non-standard error frames which fail Modbus CRC validation on this logger.
# Other KTLM-G3 models have not been hardware-tested with this profile.
# Fault 1-12 expose raw G3 bitfields; zero means no error. The legacy Sofar
# fault descriptions must not be reused for these registers.
# No batteries, off-grid output, or L2/L3 sensors are requested.

requests:
  - start: 0x0400
    end: 0x042E
    mb_functioncode: 0x03
  - start: 0x0480
    end: 0x04AF
    mb_functioncode: 0x03
  - start: 0x0580
    end: 0x0589
    mb_functioncode: 0x03
  - start: 0x0680
    end: 0x069B
    mb_functioncode: 0x03
parameters:
  - group: Solar
    items:
      - name: PV1 Power
        class: power
        state_class: measurement
        uom: W
        scale: 10
        rule: 1
        registers: [0x0586]
        icon: mdi:solar-power
      - name: PV2 Power
        class: power
        state_class: measurement
        uom: W
        scale: 10
        rule: 1
        registers: [0x0589]
        icon: mdi:solar-power
      - name: PV1 Voltage
        class: voltage
        state_class: measurement
        uom: V
        scale: 0.1
        rule: 1
        registers: [0x0584]
        icon: mdi:solar-power
      - name: PV2 Voltage
        class: voltage
        state_class: measurement
        uom: V
        scale: 0.1
        rule: 1
        registers: [0x0587]
        icon: mdi:solar-power
      - name: PV1 Current
        class: current
        state_class: measurement
        uom: A
        scale: 0.01
        rule: 1
        registers: [0x0585]
        icon: mdi:solar-power
      - name: PV2 Current
        class: current
        state_class: measurement
        uom: A
        scale: 0.01
        rule: 1
        registers: [0x0588]
        icon: mdi:solar-power
      - name: Daily Production
        class: energy
        state_class: total_increasing
        uom: kWh
        scale: 0.01
        rule: 3
        registers: [0x0685, 0x0684]
        icon: mdi:solar-power
      - name: Total Production
        class: energy
        state_class: total_increasing
        uom: kWh
        scale: 0.1
        rule: 3
        registers: [0x0687, 0x0686]
        icon: mdi:solar-power
  - group: Output
    items:
      - name: Output active power
        class: power
        state_class: measurement
        uom: W
        scale: 10
        rule: 2
        registers: [0x0485]
        icon: mdi:home-lightning-bolt
      - name: Output reactive power
        class: ''
        state_class: measurement
        uom: kVar
        scale: 0.01
        rule: 2
        registers: [0x0486]
        icon: mdi:home-lightning-bolt
      - name: Grid frequency
        class: frequency
        state_class: measurement
        uom: Hz
        scale: 0.01
        rule: 1
        registers: [0x0484]
        icon: mdi:home-lightning-bolt
      - name: L1 Voltage
        class: voltage
        state_class: measurement
        uom: V
        scale: 0.1
        rule: 1
        registers: [0x048D]
        icon: mdi:home-lightning-bolt
      - name: L1 Current
        class: current
        state_class: measurement
        uom: A
        scale: 0.01
        rule: 1
        registers: [0x048E]
        icon: mdi:home-lightning-bolt
  - group: Inverter
    items:
      - name: Inverter status
        class: ''
        state_class: ''
        uom: ''
        scale: 1
        rule: 1
        registers: [0x0404]
        lookup:
          - key: 0
            value: Stand-by
          - key: 1
            value: Self-checking
          - key: 2
            value: Normal
          - key: 3
            value: Emergency Power Supply
          - key: 4
            value: Recoverable Fault
          - key: 5
            value: Permanent Fault
          - key: 6
            value: Upgrade
          - key: 7
            value: Self-charging
          - key: 8
            value: SVG
          - key: 9
            value: PID
        icon: mdi:wrench
      - name: Inverter inner temperature
        class: temperature
        state_class: measurement
        uom: °C
        scale: 1
        rule: 2
        registers: [0x0418]
        icon: mdi:thermometer
      - name: Inverter radiator temperature
        class: temperature
        state_class: measurement
        uom: °C
        scale: 1
        rule: 2
        registers: [0x041A]
        icon: mdi:thermometer
  - group: Fault bitfields
    items:
      - name: Fault 1
        class: ''
        state_class: ''
        uom: ''
        scale: 1
        rule: 1
        registers: [0x0405]
        lookup:
          - key: 0
            value: No error
        icon: mdi:wrench
      - name: Fault 2
        class: ''
